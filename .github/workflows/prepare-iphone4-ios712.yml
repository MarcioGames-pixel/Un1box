name: Prepare iPhone 4 iOS 7.1.2

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prepare-n90ap-11D257
  cancel-in-progress: false

jobs:
  prepare:
    name: Build n90ap-11D257 .itbase
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Check out Un1box
        uses: actions/checkout@v4

      - name: Download the official IPSW
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/iphone4"
          cd "$RUNNER_TEMP/iphone4"
          curl --fail --location --retry 5 --retry-all-errors \
            --connect-timeout 30 --output iPhone3,1_7.1.2_11D257_Restore.ipsw \
            "https://secure-appldnld.apple.com/iOS7.1/031-4812.20140627.cq6y8/iPhone3,1_7.1.2_11D257_Restore.ipsw"

      - name: Verify IPSW against the Un1box catalog
        shell: bash
        run: |
          set -euo pipefail
          IPSW="$RUNNER_TEMP/iphone4/iPhone3,1_7.1.2_11D257_Restore.ipsw"
          EXPECTED_BYTES=1204958925
          EXPECTED_SHA1=81da17b3e893a61508fe203849b7e1f60e2127b1

          ACTUAL_BYTES=$(stat -f%z "$IPSW")
          ACTUAL_SHA1=$(shasum -a 1 "$IPSW" | awk '{print $1}')
          test "$ACTUAL_BYTES" = "$EXPECTED_BYTES"
          test "$ACTUAL_SHA1" = "$EXPECTED_SHA1"

          python3 - <<'PY'
          import json
          from pathlib import Path
          catalog = json.loads(Path("Portable/firmware/firmware-catalog.json").read_text())
          entry = next((e for e in catalog["entries"] if e["id"] == "n90ap-11D257"), None)
          assert entry is not None, "n90ap-11D257 is missing from the repository catalog"
          assert entry["product_type"] == "iPhone3,1"
          assert entry["board"] == "n90ap"
          assert entry["version"] == "7.1.2" and entry["build"] == "11D257"
          assert entry["source"]["bytes"] == 1204958925
          assert entry["source"]["sha1"] == "81da17b3e893a61508fe203849b7e1f60e2127b1"
          print("Catalog identity and IPSW checksum verified.")
          PY

      - name: Download the upstream LightTouch preparation tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lighttouch"
          cd "$RUNNER_TEMP/lighttouch"
          curl --fail --location --retry 5 --retry-all-errors \
            --output LightTouchMac-universal.zip \
            "https://github.com/samhenrigold/LightTouchMac/releases/download/v1.0-2026.10.20b/LightTouchMac-universal.zip"
          ACTUAL_SHA256=$(shasum -a 256 LightTouchMac-universal.zip | awk '{print $1}')
          EXPECTED_SHA256=b9d2293675df092abef4eb3af9ac0da334ff84868bea7496d2a1f8b1a481f515
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256"
          ditto -x -k LightTouchMac-universal.zip extracted
          APP=$(find extracted -type d -name "Light Touch.app" -print -quit)
          test -n "$APP"
          test -x "$APP/Contents/MacOS/firmwarekit"
          test -x "$APP/Contents/MacOS/LightTouchDevice"
          GUEST_ARCHIVE=$(find "$APP" -type f -name "guest.aar" -print -quit)
          if [ -z "$GUEST_ARCHIVE" ]; then
            echo "ERROR: The pinned LightTouchMac release ZIP has no guest.aar inside the app bundle."
            echo "App bundle layout (first 250 entries):"
            find "$APP/Contents" -maxdepth 5 -print | head -250
            echo "ZIP entries mentioning Guest or guest:"
            unzip -Z1 LightTouchMac-universal.zip | grep -iE 'guest|\.aar' | head -100 || true
            exit 1
          fi
          echo "LIGHTTOUCH_APP=$APP" >> "$GITHUB_ENV"
          echo "LIGHTTOUCH_GUEST_ARCHIVE=$GUEST_ARCHIVE" >> "$GITHUB_ENV"

      - name: Download and validate the upstream firmware catalog
        shell: bash
        run: |
          set -euo pipefail
          CATALOG="$RUNNER_TEMP/lighttouch/firmware-catalog.json"
          curl --fail --location --retry 5 --retry-all-errors \
            --output "$CATALOG" \
            "https://raw.githubusercontent.com/samhenrigold/LightTouchMac/7c4a6dd4119de29db97e8158af7dcfe21495422f/LightTouchMac/Resources/firmware-catalog.json"
          python3 - "$CATALOG" <<'PY'
          import json, sys
          from pathlib import Path
          data = json.loads(Path(sys.argv[1]).read_text())
          entry = next((e for e in data["entries"] if e["id"] == "n90ap-11D257"), None)
          if entry is None:
              raise SystemExit("Pinned upstream catalog does not contain n90ap-11D257; refusing to prepare.")
          if entry.get("product_type") != "iPhone3,1" or entry.get("build") != "11D257":
              raise SystemExit("Pinned upstream catalog entry does not match iPhone3,1 / 11D257.")
          print("Pinned upstream catalog contains the exact iPhone 4 target.")
          PY
          echo "LIGHTTOUCH_CATALOG=$CATALOG" >> "$GITHUB_ENV"

      - name: Prepare the iPhone 4 system
        shell: bash
        run: |
          set -euo pipefail
          IPSW="$RUNNER_TEMP/iphone4/iPhone3,1_7.1.2_11D257_Restore.ipsw"
          FIRMWAREKIT="$LIGHTTOUCH_APP/Contents/MacOS/firmwarekit"
          CATALOG="$LIGHTTOUCH_CATALOG"
          HELPER="$LIGHTTOUCH_APP/Contents/MacOS/LightTouchDevice"
          GUEST_ARCHIVE="$LIGHTTOUCH_GUEST_ARCHIVE"
          GUEST_DIR="$RUNNER_TEMP/iphone4/guest"
          GUEST_TOOLS="$GUEST_DIR/ipad-guest-tools"
          OUT="$RUNNER_TEMP/iphone4/output/n90ap-11D257"

          mkdir -p "$(dirname "$OUT")" "$GUEST_DIR"
          /usr/bin/aa extract -i "$GUEST_ARCHIVE" -d "$GUEST_DIR" \
            2>&1 | tee "$RUNNER_TEMP/iphone4/guest-extract.log"
          if [ ! -d "$GUEST_TOOLS" ]; then
            echo "ERROR: guest.aar was extracted, but ipad-guest-tools is missing."
            echo "Extracted guest archive contents:"
            find "$GUEST_DIR" -maxdepth 4 -print | head -300
            exit 1
          fi
          FIRMWAREKIT_IBOOT_PATCHER="$LIGHTTOUCH_APP/Contents/MacOS/iBoot32Patcher" \
            "$FIRMWAREKIT" create \
              --catalog "$CATALOG" \
              --id n90ap-11D257 \
              --ipsw "$IPSW" \
              --out "$OUT" \
              --helper "$HELPER" \
              --guest-tools "$GUEST_TOOLS" \
              --cache "$RUNNER_TEMP/iphone4/decrypt-cache" \
              2>&1 | tee "$RUNNER_TEMP/iphone4/create.log"

          test -f "$OUT/device.lock.json"
          "$FIRMWAREKIT" pack-base \
            --base "$OUT" \
            --out "$RUNNER_TEMP/iphone4/output/n90ap-11D257.itbase" \
            2>&1 | tee "$RUNNER_TEMP/iphone4/pack.log"

          test -s "$RUNNER_TEMP/iphone4/output/n90ap-11D257.itbase"
          shasum -a 256 "$RUNNER_TEMP/iphone4/output/n90ap-11D257.itbase" \
            > "$RUNNER_TEMP/iphone4/output/n90ap-11D257.itbase.sha256"

          cat > "$RUNNER_TEMP/iphone4/output/BUILD-INFO.txt" <<EOF
          Device: iPhone 4 GSM (iPhone3,1)
          Board: n90ap
          iOS: 7.1.2
          Build: 11D257
          Catalog ID: n90ap-11D257
          Preparation tool: upstream LightTouch firmwarekit
          IPSW SHA-1: 81da17b3e893a61508fe203849b7e1f60e2127b1
          Note: Experimental firmware preparation; artifact is not proof of successful boot.
          EOF

      - name: Upload prepared system as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Un1box-iPhone4-iOS7.1.2-n90ap-11D257
          path: |
            ${{ runner.temp }}/iphone4/output/n90ap-11D257.itbase
            ${{ runner.temp }}/iphone4/output/n90ap-11D257.itbase.sha256
            ${{ runner.temp }}/iphone4/output/BUILD-INFO.txt
            ${{ runner.temp }}/iphone4/create.log
            ${{ runner.temp }}/iphone4/pack.log
            ${{ runner.temp }}/iphone4/guest-extract.log
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
